[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-vtg"
version = "0.2.0"
description = "Extensible frozen-model video temporal grounding benchmarks"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "peft>=0.18,<1",
  "Pillow>=10",
  "qwen-vl-utils>=0.0.14",
  "scenedetect[opencv-headless]>=0.6.4,<0.7",
  "sentence-transformers>=5.4,<6",
  "scipy>=1.13",
  "torch>=2.4",
  "torchvision>=0.19",
  "tqdm>=4.66",
  "transformers>=4.57,<5",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
downloads = ["gdown>=5.2", "huggingface-hub>=0.30"]
univtg-video = ["pytorchvideo>=0.1.5"]

[project.scripts]
hybrid-vtg = "hybrid_vtg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["src/hybrid_vtg/models/univtg/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
