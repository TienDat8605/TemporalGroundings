[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-vtg"
version = "0.1.0"
description = "Training-free timeline-preserving spatial allocation for video temporal grounding"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hybrid-vtg = "hybrid_vtg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
